server:
  port: ${PORT:10000}

spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 30

  flyway:
    enabled: true
    validate-on-migrate: true

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-southeast-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres.oacpfgjljxyttqdqafrf}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Omsingh@1233}}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: InstagramCloneHikariCP-Prod
      maximum-pool-size: 25
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

logging:
  level:
    root: WARN
    com.instagramclone: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN

app:
  rate-limit:
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://likeinstagra.netlify.app}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:mmryuaqu}
    api-key: ${CLOUDINARY_API_KEY:774434692749313}
    api-secret: ${CLOUDINARY_API_SECRET:_j3wNV79jyvA55tCOQ6Yd0Lfo4k}
    fallback-on-failure: ${CLOUDINARY_FALLBACK_ON_FAILURE:false}
    max-retries: ${CLOUDINARY_MAX_RETRIES:3}
    retry-backoff-ms: ${CLOUDINARY_RETRY_BACKOFF_MS:500}

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

