spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: InstagramCloneHikariCP
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

logging:
  level:
    com.instagramclone: INFO
    org.springframework: WARN

app:
  mail:
    enabled: false
    from: no-reply@instagram.com
    verification-url: http://localhost:5173/verify-email
    reset-url: http://localhost:5173/reset-password
  cloudinary:
    cloud-name: test-cloud
    api-key: test-key
    api-secret: test-secret
  admin:
    seed: false
